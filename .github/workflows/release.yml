name: Build release installers

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag
        id: revision
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            RELEASE_TAG="manual-$GITHUB_RUN_ID"
          else
            git check-ref-format "refs/tags/$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: debian
            file: chksmg.deb
          - os: windows-latest
            package: windows
            file: chksmg-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Debian package
        if: matrix.package == 'debian'
        shell: bash
        run: |
          set -euo pipefail
          bash installer/build-debian.sh
          dpkg-deb --info installer/dist/chksmg.deb
          dpkg-deb --contents installer/dist/chksmg.deb
      - name: Install Windows build dependencies
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
      - name: Build Windows installer
        if: matrix.package == 'windows'
        shell: pwsh
        run: ./installer/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.package }}
          path: installer/dist/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Create draft release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test -s dist/chksmg.deb
          test -s dist/chksmg-setup.exe
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/chksmg.deb dist/chksmg-setup.exe --clobber
